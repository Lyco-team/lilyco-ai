[workspace]
members = [
    "lilyco-aic",
    "lilyco-bitnet",
    "lilyco-chatgpt",
    "lilyco-codearts",
    "lilyco-deepseek",
    "lilyco-mpkg",
    "lilyco-web2cli",
    "lilyco-webai",
    "lilyco-webchat-core",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lyco-team/lilyco-ai"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
cookie = "0.18"
ring = "0.17"
scraper = "0.23"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = "1"
toml = "1"
url = "2"

[profile.dev]
opt-level = 1
debug = false
