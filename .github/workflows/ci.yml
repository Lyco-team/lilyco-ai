name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile all workspace targets including CDP e2e tests
        run: cargo test --workspace --no-run
      - name: Run headless unit and integration tests
        run: |
          cargo test -p lilyco-aic -p lilyco-bitnet -p lilyco-mpkg
          cargo test -p lilyco-web2cli --lib
