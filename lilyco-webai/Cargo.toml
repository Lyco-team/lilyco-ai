[package]
name = "lilyco-webai"
version.workspace = true
edition = "2021"
description = "lwebai — 豆包 / 千问 / Kimi / ZCode 的纯 Rust CDP 登录与多账号管理：自动截取/刷新二维码、保存 cookies+localStorage、账号切换"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lyco-team/lilyco-ai"
keywords = ["cli", "cdp", "mcp", "doubao", "kimi"]
categories = ["command-line-interface", "web-programming"]

[[bin]]
name = "lwebai"
path = "src/main.rs"

[dependencies]
# 与 ldeepseek / lchatgpt 相同：四端 facade + 纯 Rust CDP
lilyco = { version = "0.3", git = "https://github.com/lilyco-42/lilyco.git", optional = true, default-features = false }
lilyco-webchat-core = { path = "../lilyco-webchat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["full"]
full = ["dep:lilyco", "lilyco/full"]
android = ["dep:lilyco"]