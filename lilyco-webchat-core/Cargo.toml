[package]
name = "lilyco-webchat-core"
version.workspace = true
edition = "2021"
description = "Reusable browser-to-CLI/OpenAI/MCP core for Lilyco web-AI tools (lchatgpt, ldeepseek, etc.): CDP driver, serial queue, Bearer auth, hourly rate-limiter, session continuation, token estimation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lyco-team/lilyco-ai"
keywords = ["cli", "cdp", "openai", "mcp", "webchat"]
categories = ["command-line-interface", "web-programming"]

[dependencies]
lilyco = { version = "0.3", git = "https://github.com/lilyco-42/lilyco.git", default-features = false }
serde = { version = "1", features = ["derive"] }
base64 = { workspace = true }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio = { workspace = true, features = ["sync"] }
